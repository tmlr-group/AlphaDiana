# Experiment: MMMU-Pro vision × ZeroClaw × google/gemma-4-31B-it
# Parameter contract: T=0.0, K=1, top_p=0.95, max_tokens=131072,
# max_concurrent=4, request_timeout=3600.

run_id: "mmmu_pro_vision_zeroclaw_gemma_4_31b_it_cell"

agent:
  name: zeroclaw
  version: "0.6.9"
  config:
    model: "google/gemma-4-31B-it"
    api_base: "http://host.docker.internal:8011/v1"
    api_key: "EMPTY"
    provider_api_base: "http://host.docker.internal:8011/v1"
    provider_api_key: "EMPTY"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    request_timeout: 3600
    enable_thinking: true
    runtime_trace_mode: "full"
    capture_logprobs: true
    top_logprobs: 20
    docker_host_ip: "host.docker.internal"
    network_mode: "host"
    max_tool_iterations: 100
    max_actions_per_hour: 200
    rock_image: "zeroclaw-reasoning:0.6.9"
    rock_memory: "4g"
    rock_cpus: 1
    rock_startup_timeout: 600
    admin_base_url: "${ROCK_BASE_URL}"
    proxy_base_url: "${ROCK_PROXY_URL}"
    system_prompt: |
      You are an expert at multimodal multiple-choice reasoning.
      Carefully analyze any provided images along with the question text and options.
      Think through the problem step by step before selecting your answer.
      Respond with the final answer on the last line as:
      $$\boxed{X}$$
      where X is the single correct option letter.

benchmark:
  name: mmmu_pro
  config:
    dataset: "MMMU/MMMU_Pro"
    data_config: "vision"
    split: "test"

scorer:
  name: exact_match
  config: {}

max_concurrent: 4
num_samples: 1
task_retries: 2
output_dir: "./results"
metadata:
  experiment: "mmmu_pro_vision-zeroclaw-gemma-4-31b-it"
