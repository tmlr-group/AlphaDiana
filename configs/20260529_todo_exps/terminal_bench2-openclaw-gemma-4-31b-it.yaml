# Experiment: Terminal-Bench V2 × OpenClaw × google/gemma-4-31B-it
# Parameter contract: T=0.0, K=1, top_p=0.95, max_tokens=131072,
# max_concurrent=4, request_timeout=3600.

run_id: "terminal_bench2_openclaw_gemma_4_31b_it_cell"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_DIR}

agent:
  name: terminal_bench2_openclaw
  version: "2026.3.20"
  config:
    container_engine: podman
    model: "google/gemma-4-31B-it"
    model_name: "google/gemma-4-31B-it"
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    runtime_source_image: "${TB2_OPENCLAW_RUNTIME_IMAGE:-localhost/alphadiana-openclaw-fixed:latest}"
    logs_base_dir: "${ALPHADIANA_TB2_LOGS_DIR}"
    podman_network: "host"
    gateway_token: "${OPENCLAW_GATEWAY_TOKEN:-OPENCLAW}"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    request_timeout: 3600
    stream_idle_timeout: 3600
    stream_total_timeout: 3600
    enable_thinking: true
    solver_timeout_sec: 3600
    timeout_sec: 900
    test_timeout_sec: 1200

scorer:
  name: terminal_bench2

max_concurrent: 4
num_samples: 1
output_dir: "${ALPHADIANA_TB2_OUTPUT_DIR:-./results/terminal_bench2_openclaw_gemma_4_31b_it}"
metadata:
  experiment: "terminal_bench2-openclaw-gemma-4-31b-it"
  container_engine: "podman"
