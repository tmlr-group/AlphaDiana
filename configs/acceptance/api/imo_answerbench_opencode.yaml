run_id: api_accept_imo_answerbench_opencode
agent:
  name: opencode
  version: 1.3.2
  config:
    model: custom/Qwen/Qwen3.5-27B
    model_name: Qwen/Qwen3.5-27B
    api_base: ${AD_ACCEPTANCE_API_BASE}
    api_key: ${AD_ACCEPTANCE_API_KEY}
    controller_mode: podman
    controller_image: ${AD_ACCEPTANCE_OPENCODE_IMAGE}
    timeout: 1200
    streaming: false
    tool_call: true
    system_prompt: 'Solve efficiently and keep the response short.

      The final line must be $$\boxed{your answer here}$$.

      '
    temperature: 0.0
    top_p: 0.95
    max_tokens: 8192
    enable_thinking: false
    capture_logprobs: true
    top_logprobs: 20
    api_model: Qwen/Qwen3.5-27B
    controller_network: host
    context_limit: 32768
    input_limit: 24576
    output_limit: 8192
benchmark:
  name: imo_answerbench
  config:
    dataset: Hwilner/imo-answerbench
    split: train
    max_tasks: 3
scorer:
  name: imo_verify
max_concurrent: 1
num_samples: 1
output_dir: ${AD_ACCEPTANCE_RESULTS}
strict_report: true
strict_isolation: true
metadata:
  validation_suite: api
  fixture: imo_answerbench
  model_family: Qwen/Qwen3.5-27B
  capture_requirement: report actual coverage; do not impute missing observations
task_retries: 0
