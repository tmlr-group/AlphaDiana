run_id: api_accept_mmmu_pro_opencode
agent:
  name: opencode
  version: 1.3.2
  config:
    model: custom/Qwen/Qwen3.5-27B
    model_name: Qwen/Qwen3.5-27B
    api_base: ${AD_ACCEPTANCE_API_BASE}
    api_key: ${AD_ACCEPTANCE_API_KEY}
    controller_mode: podman
    controller_image: ${AD_ACCEPTANCE_OPENCODE_IMAGE}
    timeout: 1200
    streaming: false
    tool_call: true
    system_prompt: 'You are an expert at multiple-choice reasoning.

      Read the question carefully and select the single best option.


      Respond with the final answer on the last line as:

      $$\boxed{X}$$

      where X is the single correct option letter.

      '
    temperature: 0.0
    top_p: 0.95
    max_tokens: 8192
    enable_thinking: false
    capture_logprobs: true
    top_logprobs: 20
    api_model: Qwen/Qwen3.5-27B
    controller_network: host
    context_limit: 32768
    input_limit: 24576
    output_limit: 8192
benchmark:
  name: mmmu_pro
  config:
    dataset: MMMU/MMMU_Pro
    data_config: vision
    split: test
    max_tasks: 3
scorer:
  name: exact_match
  config: {}
max_concurrent: 1
num_samples: 1
output_dir: ${AD_ACCEPTANCE_RESULTS}
strict_report: true
strict_isolation: true
metadata:
  validation_suite: api
  fixture: mmmu_pro
  model_family: Qwen/Qwen3.5-27B
  capture_requirement: report actual coverage; do not impute missing observations
task_retries: 0
