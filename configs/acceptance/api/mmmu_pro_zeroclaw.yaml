run_id: api_accept_mmmu_pro_zeroclaw
agent:
  name: zeroclaw
  version: 0.6.9
  config:
    model: Qwen/Qwen3.5-27B
    api_base: ${AD_ACCEPTANCE_API_BASE}
    api_key: ${AD_ACCEPTANCE_API_KEY}
    request_timeout: 1200
    max_tool_iterations: 30
    max_actions_per_hour: 200
    system_prompt: 'You are solving MMMU-Pro multiple-choice questions. Inspect any
      workspace

      attachments referenced by the prompt before deciding.


      When you have reached your final answer, you MUST present it at the very

      end in the form:


      $$\boxed{your answer here}$$

      '
    provider_api_base: ${AD_ACCEPTANCE_API_BASE}
    provider_api_key: ${AD_ACCEPTANCE_API_KEY}
    temperature: 0.0
    top_p: 0.95
    max_tokens: 8192
    enable_thinking: false
    capture_logprobs: true
    top_logprobs: 20
    runtime_backend: podman
    podman_image: ${AD_ACCEPTANCE_ZEROCLAW_IMAGE}
    podman_network: slirp4netns:allow_host_loopback=true
    gateway_warmup_timeout: 120
    runtime_trace_mode: full
benchmark:
  name: mmmu_pro
  config:
    dataset: MMMU/MMMU_Pro
    data_config: vision
    split: test
    max_tasks: 3
sandbox: null
scorer:
  name: exact_match
max_concurrent: 1
num_samples: 1
output_dir: ${AD_ACCEPTANCE_RESULTS}
strict_report: true
strict_isolation: true
metadata:
  validation_suite: api
  fixture: mmmu_pro
  model_family: Qwen/Qwen3.5-27B
  capture_requirement: report actual coverage; do not impute missing observations
task_retries: 0
