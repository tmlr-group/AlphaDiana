run_id: api_accept_terminal_bench2_openclaw
agent:
  name: terminal_bench2_openclaw
  version: 2026.3.2
  config:
    container_engine: docker
    api_base: ${AD_ACCEPTANCE_API_BASE}
    api_key: ${AD_ACCEPTANCE_API_KEY}
    model_name: Qwen/Qwen3.5-27B
    runtime_source_image: ${AD_ACCEPTANCE_OPENCLAW_TB2_IMAGE}
    logs_base_dir: ${AD_ACCEPTANCE_WORK}/tb2-logs
    podman_network: host
    openclaw_bin: openclaw
    onboard_timeout_sec: 180
    solver_timeout_sec: 1800
    timeout_sec: 900
    test_timeout_sec: 1200
    model: Qwen/Qwen3.5-27B
    capture_logprobs: true
    top_logprobs: 20
    max_tokens: 8192
    temperature: 0.0
    enable_thinking: false
    retain_verifier_snapshot: true
benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${AD_ACCEPTANCE_TB2_DIR}
    task_ids:
    - db-wal-recovery
    - overfull-hbox
    - adaptive-rejection-sampler
    max_tasks: 3
scorer:
  name: terminal_bench2
max_concurrent: 1
num_samples: 1
output_dir: ${AD_ACCEPTANCE_RESULTS}
strict_report: true
strict_isolation: true
metadata:
  validation_suite: api
  fixture: terminal_bench2
  model_family: Qwen/Qwen3.5-27B
  capture_requirement: report actual coverage; do not impute missing observations
task_retries: 0
