agent:
  name: sweagent
  version: 1.1.0
  config:
    executable: ${ISSUE96_SWEAGENT_BIN}
    checkout: ${ISSUE96_SWEAGENT_CHECKOUT}
    model: Qwen/Qwen3.5-27B
    api_base: ${ISSUE96_API_BASE}
    api_key: ${ISSUE96_API_KEY}
    max_tokens: 8192
    max_calls: 30
    timeout: 1800
    container_runtime: docker
    output_dir: ${ISSUE96_WORK}/native-sweagent
    completion_kwargs:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    python_standalone_dir: ''
    image_overrides:
      django__django-11790: swebench/sweb.eval.x86_64.django_1776_django-11790:issue96-base
      django__django-11815: swebench/sweb.eval.x86_64.django_1776_django-11815:issue96-base
      django__django-11848: swebench/sweb.eval.x86_64.django_1776_django-11848:issue96-base
benchmark:
  name: swe_bench
  config:
    dataset: MariusHobbhahn/swe-bench-verified-mini
    split: test
    task_ids:
    - django__django-11790
    - django__django-11815
    - django__django-11848
    max_tasks: 3
scorer:
  name: swe_bench
  config:
    timeout: 900
    container_engine: docker
    log_dir: ${ISSUE96_WORK}/swe-verifier
    instance_image_tag: issue96-base
run_id: issue96_accept_swe_mini_sweagent
output_dir: ${ISSUE96_RESULTS}
num_samples: 1
max_concurrent: 1
task_retries: 0
strict_report: true
strict_isolation: true
metadata:
  acceptance_issue: 96
  fixture: swe_mini
  model_family: Qwen/Qwen3.5-27B
  capture_requirement: report actual coverage; do not impute missing observations
