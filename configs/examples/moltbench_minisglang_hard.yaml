# mini-SGLang Hard — Agent receives NO optimization guidance (must discover it).
#
# Same podman/AlphaDiana setup as the Easy config; only the difficulty (and thus
# the system prompt the container builds) differs. See moltbench_minisglang_easy.yaml
# for the full setup notes (GPU via nvidia-container-runtime, in-situ baseline, etc.).

run_id: "mini-sglang-hard-v1"

agent:
  name: moltbench_docker
  version: "1.0"
  config:
    agent_type: openclaw
    image: "localhost/mini-sglang-openclaw:dev"
    container_engine: podman
    gpu_mode: nvidia-runtime
    gpus: "5"                         # ⚠️ EXAMPLE id — set to a FREE GPU (check `nvidia-smi`).
                                      # If running easy + hard at once, use DIFFERENT free GPU ids
                                      # (same id => KV-cache contention biases throughput).
    network_mode: host
    memory: "48g"
    request_timeout: 3600
    mount_claude_auth: false
    # ⚠️ EXAMPLE paths are for OUR A800 cluster — REPLACE host (left) side with yours.
    # See moltbench/docs/mini-sglang-reproduce.md. (Thick `:repro` image: drop env mount.)
    volume_mounts:
      - "/data3/jinbo/envs/mini_sglang:/opt/minisgl-env:ro"   # host conda env -> stable in-container path (dev image only)
      - "/usr/local/cuda:/usr/local/cuda:ro"                  # host CUDA toolkit (nvcc for flashinfer JIT)
      - "/data0/models:/data0/models:ro"                      # host HF/model cache (replace with yours)
    output_dir: "./mini_sglang_artifacts_hard_v1"
    env:
      # Pluggable model (see easy config). Replace MODELS_HUB with your HF cache hub dir.
      MODEL: "qwen3-4b"                  # qwen3-0.6b | qwen3-1.7b | qwen3-4b | qwen3-8b
      MODELS_HUB: "/data0/models/hub"    # ⚠️ replace with your HF cache hub dir
      SERVED_MODEL_NAME: "Qwen3-4B"
      MEMORY_RATIO: "0.3"
      EVAL_NUM_PROMPTS: "256"
      EVAL_INPUT_LEN: "128"
      EVAL_OUTPUT_LEN: "512"
      EVAL_WARMUP: "1"
      EVAL_REPEATS: "2"
      FAST_WARMUP: "1"
      FAST_REPEATS: "1"
      OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
      OPENAI_MODEL_NAME: "qwen/qwen3-235b-a22b-2507"
      OPENCLAW_GATEWAY_TOKEN: "MOLTBENCH"
      # OPENAI_API_KEY is auto-injected from the host environment at runtime.

benchmark:
  name: moltbench
  config:
    task: mini_sglang
    difficulty: "hard"
    model_name: "Qwen3-4B"            # friendly name shown in the agent prompt only
    max_attempts: 3                   # attempts budget (one /eval/run_eval call = 1 attempt; not "rounds")
    baseline_throughput: 4813.0
    # ── Scope (MoltBench Design-4 §3/§9): single-stage serving optimization.
    # No drift / memory stages, so S and M are N/A (declared, not omitted).
    moltbench_task_level: "optimization_only"
    stability_metric: "N/A"
    memory_metric: "N/A"
    drift_metric: "N/A"

scorer:
  name: moltbench
  config:
    thresholds: [1.0, 1.05, 1.1, 1.2, 1.5]
    score_mode: "final"

max_concurrent: 1
output_dir: "./results_mini_sglang_hard_v1"
