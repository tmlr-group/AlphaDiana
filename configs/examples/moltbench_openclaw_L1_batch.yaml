# MoltBench batch evaluation — OpenClaw + DeepSeek, L1 P001-P020
#
# Usage:
#   cd /data/users/weikaihuang/projects/MoltBench/AlphaDiana
#   set -a && source ../.env && set +a
#   python3 -m alphadiana.cli run configs/examples/moltbench_openclaw_L1_batch.yaml

task: kernelbench
run_id: "moltbench-openclaw-L1-batch-v1"

agent:
  name: moltbench_docker
  version: "1.0"
  config:
    agent_type: openclaw
    image_prefix: tmlrgroup/alphadiana
    request_timeout: 900       # 15 min hard timeout per container
    gpus: '"device=3"'
    network_mode: "host"
    output_dir: "./moltbench_artifacts_L1_batch"
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_MODEL_NAME: "deepseek-chat"
      OPENCLAW_AGENT_TIMEOUT_SEC: "600"
      OPENCLAW_CHAT_MAX_TIME_SEC: "660"

benchmark:
  name: moltbench
  config:
    levels: [1]
    problems: "1-20"
    max_rounds: 10
    backend: triton

scorer:
  name: moltbench
  config:
    thresholds: [1.0, 1.5, 2.0, 3.0, 5.0]
    score_mode: "final"

max_concurrent: 1
output_dir: "./results_L1_batch"
