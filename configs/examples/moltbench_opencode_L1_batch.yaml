# MoltBench batch evaluation — OpenCode + DeepSeek, L1 P001-P020
# Zero-injection aligned prompts, see docs/moltbench_agent_alignment.md
#
# Usage:
#   cd /path/to/AlphaDiana
#   set -a && source ../.env && set +a
#   python3 -m alphadiana.cli run configs/examples/moltbench_opencode_L1_batch.yaml

task: kernelbench
run_id: "moltbench-opencode-L1-v1"

agent:
  name: moltbench_docker
  version: "1.0"
  config:
    agent_type: opencode
    image_prefix: tmlrgroup/alphadiana
    request_timeout: 1500
    gpus: '"device=3"'
    network_mode: "host"
    output_dir: "./moltbench_artifacts_opencode_L1_v1"
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_MODEL_NAME: "deepseek-chat"
      OPENCODE_TIMEOUT_SEC: "1200"

benchmark:
  name: moltbench
  config:
    levels: [1]
    problems: "1-20"
    max_rounds: 10
    backend: triton

scorer:
  name: moltbench
  config:
    thresholds: [1.0, 1.5, 2.0, 3.0, 5.0]
    score_mode: "final"

max_concurrent: 1
output_dir: "./results_opencode_L1_v1"
