# MoltBench QJL evaluation: OpenClaw in a Podman-managed QJL container.
#
# Build images first:
#   podman build --network host -f moltbench/docker/Dockerfile.qjl-base -t localhost/alphadiana:qjl-base .
#   podman build --network host -f moltbench/docker/Dockerfile.qjl-verifier -t localhost/alphadiana:qjl-verifier .
#   podman build --network host -f moltbench/docker/Dockerfile.qjl-openclaw -t localhost/alphadiana:qjl-openclaw .
#
# Run:
#   python3 -m alphadiana.cli run configs/examples/moltbench_qjl_openclaw_podman.yaml

task: qjl
run_id: "moltbench-qjl-openclaw-podman"

agent:
  name: moltbench_docker
  version: "1.0"
  config:
    agent_type: openclaw
    container_engine: podman
    container_engine_binary: "podman"
    container_runtime: runc
    image: localhost/alphadiana:qjl-openclaw
    verifier_image: localhost/alphadiana:qjl-verifier
    request_timeout: 3600
    network_mode: "host"
    podman_gpu_args: ["--device", "nvidia.com/gpu=0"]
    shm_size: "1g"
    ipc_mode: "private"
    output_dir: "./moltbench_artifacts_qjl_podman"
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_MODEL_NAME: ""
      OPENCLAW_AGENT_TIMEOUT_SEC: "3000"
      OPENCLAW_CHAT_MAX_TIME_SEC: "3060"

benchmark:
  name: moltbench_qjl
  config:
    seed_config_path: "moltbench/seeds/qjl/seed_config.json"
    baseline_json_path: "moltbench/tasks/qjl/expected_outputs/baseline_result.json"
    distortion_threshold: 0.52
    max_attempts: 5
    attempt_timeout_sec: 1200
    total_timeout_sec: 3600
    retention_threshold: 0.90

scorer:
  name: moltbench_qjl
  config: {}

max_concurrent: 1
output_dir: "./results_qjl_podman"
