# MoltBench Level 1 batch evaluation — ZeroClaw
#
# Runs ZeroClaw on all Level 1 KernelBench problems.
# ZeroClaw is a Rust-based lightweight AI agent with 75+ built-in tools.
#
# Prerequisites:
#   1. Build the Docker image:
#        docker build -f moltbench/docker/Dockerfile.zeroclaw -t tmlrgroup/alphadiana:zeroclaw .
#   2. Export provider credentials:
#        export OPENAI_API_KEY=...
#        export OPENAI_BASE_URL=http://your-vllm-host:8000/v1
#        export OPENAI_MODEL_NAME=your-model-name

task: kernelbench
run_id: "moltbench-zeroclaw-L1-batch"

agent:
  name: moltbench_docker
  version: "1.0"
  config:
    agent_type: zeroclaw
    image_prefix: tmlrgroup/alphadiana
    request_timeout: 1800
    gpus: "device=0"
    network_mode: "host"
    output_dir: "./moltbench_artifacts_zeroclaw_L1"
    env:
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_MODEL_NAME: "deepseek-chat"
      ZEROCLAW_TIMEOUT_SEC: "1500"

benchmark:
  name: moltbench
  config:
    levels: [1]
    problems: "all"
    max_rounds: 10
    backend: triton

scorer:
  name: moltbench
  config:
    thresholds: [1.0, 1.5, 2.0, 3.0, 5.0]
    score_mode: "final"

max_concurrent: 1
output_dir: "./results_zeroclaw_L1_batch"
