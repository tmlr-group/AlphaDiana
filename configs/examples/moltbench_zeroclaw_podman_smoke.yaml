# MoltBench smoke test — ZeroClaw agent on Podman
# Quick validation of Podman + ZeroClaw + OpenAI-compatible API.
#
# Run:
#   export OPENAI_API_KEY="your-token"
#   python3 -m alphadiana.cli run configs/examples/moltbench_zeroclaw_podman_smoke.yaml --redo-all

run_id: moltbench-zeroclaw-podman-smoke

agent:
  name: moltbench_podman
  version: "1.0"
  config:
    container_engine: podman
    image: localhost/tmlrgroup/alphadiana:zeroclaw
    agent_type: zeroclaw
    mount_claude_auth: false
    gpu_count: 1
    env:
      OPENAI_MODEL_NAME: "mimo-v2.5-pro"

benchmark:
  name: moltbench
  config:
    levels: [1]
    problems: "1"
    source: hf

max_concurrent: 1
num_samples: 1

scorer:
  name: moltbench
