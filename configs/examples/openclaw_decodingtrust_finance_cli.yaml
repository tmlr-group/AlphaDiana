run_id: "openclaw_decodingtrust_finance_cli"

agent:
  name: openclaw
  version: "decodingtrust-openclaw-cli-v1"
  config:
    runtime_backend: decodingtrust_openclaw_cli
    model: "${OPENAI_MODEL_NAME}"
    temperature: 0
    max_turns: 10
    system_prompt: ""
    debug: false
    

benchmark:
  name: decodingtrust
  config:
    domain: finance
    task_types:
      - benign
      - direct
      - indirect
    # One task per type so the smoke run covers benign/direct/indirect evenly
    # (a global `limit` would otherwise be spent entirely on the first type).
    limit_per_type: 1
    # Reproducibility: pin the DecodingTrust-Agent submodule commit.
    # Set require_pinned_commit: true to hard-fail on a mismatched checkout.
    pinned_commit: "6586b3b695b19c6b4d0b591e1739135404f5cce4"
    require_pinned_commit: false

sandbox:
  name: decodingtrust
  config:
    setup_timeout: 900

scorer:
  name: decodingtrust
  config: {}

max_concurrent: 1
num_samples: 1
task_retries: 0
output_dir: "./results"
metadata:
  notes: "Runs DTAP OpenClawAgent/OpenClaw CLI in-process while AlphaDiana owns scheduling, sandbox, result JSONL, and scoring."
