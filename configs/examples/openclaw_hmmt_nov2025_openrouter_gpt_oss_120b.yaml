run_id: "openclaw-gpt-oss-120b-free-hmmt-nov-2025-001"

agent:
  name: openclaw
  version: "latest"
  config:
    # Replace <SANDBOX_ID> with your actual ROCK sandbox ID.
    api_base: "http://localhost:9001/apis/envs/sandbox/v1/sandboxes/<SANDBOX_ID>/proxy/v1"
    model: openclaw
    gateway_token: "OPENCLAW"
    temperature: 0.0
    max_tokens: 16384

benchmark:
  name: aime
  config:
    dataset: "MathArena/hmmt_nov_2025"
    split: "train"
    problem_field: "problem"
    answer_field: "answer"

sandbox: null

scorer:
  name: exact_match

max_concurrent: 1
output_dir: "./results"
metadata:
  author: "your_name"
  notes: "OpenClaw + OpenRouter openai/gpt-oss-120b:free on MathArena/hmmt_nov_2025"
