run_id: "openclaw-qwen3-27b-imo-answerbench-001"  # Unique identifier for this evaluation run

agent:
  name: openclaw                # Agent type: openclaw
  version: "2026.3.20"          # OpenClaw version
  config:
    # OpenClaw gateway endpoint (proxied via ROCK)
    # Single sandbox:   export SANDBOX_ID=<id>
    api_base: "http://localhost:${ROCK_PROXY_PORT}/apis/envs/sandbox/v1/sandboxes/${SANDBOX_ID}/proxy/v1"
    model: openclaw             # Model name as seen by the gateway (always "openclaw")
    gateway_token: "OPENCLAW"   # Must match OPENCLAW_GATEWAY_TOKEN in rock_agent_config.yaml
    max_tokens: 65536           # Maximum tokens per response
    request_timeout: 1800       # Request timeout in seconds
    max_attempts: 5             # Max retry attempts per task on failure
    system_prompt: |
      You are an expert problem solver. When given a problem, actively use your available tools and skills throughout your reasoning process. Do not attempt to solve problems purely in your head when tools can help. Use code execution, search, or any other available capabilities to verify intermediate steps, explore approaches, and confirm your final answer.

      When you have reached your final answer, you MUST present it in the following format:

      $$\boxed{your answer here}$$

      Do not skip the boxed format. The boxed answer must appear at the very end of your response and contain only the final answer, not explanations.

benchmark:
  name: imo_answerbench          # Benchmark name registered in BenchmarkRegistry
  config:
    dataset: "Hwilner/imo-answerbench"  # HuggingFace dataset identifier
    split: "train"              # Dataset split to evaluate on
    max_tasks: 5                # Limit to 5 tasks for pipeline validation
    # category: "Algebra"       # Uncomment to filter: Algebra/Combinatorics/Geometry/Number Theory
    # category_field: "category"  # Column name for category filter (default: "category")

sandbox: null                   # OpenClaw already runs inside ROCK; no extra sandbox needed

scorer:
  name: math_verify             # Scorer type for math answer verification (symbolic equivalence)
  config:
    tolerance: 1e-6             # Numerical tolerance for math answer comparison

max_concurrent: 1               # Number of tasks to run in parallel
output_dir: "./results"         # Directory for output JSONL files
metadata:
  author: "alphadiana"          # Author of this evaluation run
  gpu: "A800"                   # GPU used for inference
  notes: "OpenClaw + Qwen3-27B on IMO-AnswerBench. Set HF_ENDPOINT=https://hf-mirror.com on A800."
