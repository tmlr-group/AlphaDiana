run_id: "openclaw-qwen-math-rock-001"

agent:
  name: openclaw
  version: "v0.3.1"
  config:
    model: qwen2.5-72b
    api_base: "http://localhost:8000/v1"
    temperature: 0.0
    max_tokens: 8192

benchmark:
  name: math
  config:
    split: "test"

sandbox:
  name: rock
  config:
    endpoint: "http://localhost:8080"
    image: "python:3.11-slim"
    timeout: 300

scorer:
  name: exact_match

max_concurrent: 4
output_dir: "./results"
metadata:
  author: "zjk"
  gpu: "A800"
  notes: "OpenClaw on MATH with ROCK sandbox"
