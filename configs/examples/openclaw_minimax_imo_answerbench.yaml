# SMOKE ONLY: deterministic 1-task config for path validation.
# Full benchmark config: configs/full_runs/p25_full_openclaw_minimax_imo_answerbench.yaml.
#
# Recommended local smoke config for OpenClaw x IMO-AnswerBench.
# Requires:
#   source scripts/activate.sh
#   export OPENAI_BASE_URL=https://api.example.com/v1
#   export OPENAI_API_KEY=...

run_id: "openclaw_minimax_imo_smoke"

agent:
  name: openclaw
  version: "2026.3.20"
  config:
    rock_image: "tmlrgroup/alphadiana:v1"
    rock_agent_config_path: "openclaw_deploy/rock_agent_config.prebuilt.yaml"
    openclaw_config_path: "openclaw_deploy/openclaw.json"
    rock_memory: "4g"
    rock_cpus: 1
    rock_startup_timeout: 600
    gateway_startup_timeout: 240
    gateway_warmup_timeout: 240
    OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    OPENAI_MODEL_NAME: "minimax-m2.5"
    model: openclaw
    gateway_token: "OPENCLAW"
    max_tokens: 512
    request_timeout: 2400
    max_attempts: 5
    system_prompt: |
      You are an expert problem solver. Use available tools when they help.

      The final line must be:
      $$\boxed{your answer here}$$

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"
    dataset_index: 367
    max_tasks: 1

sandbox: null

scorer:
  name: math_verify
  config:
    tolerance: 1e-6

max_concurrent: 1
output_dir: "./results/openclaw_minimax_imo_smoke"
metadata:
  notes: "OpenClaw auto-deploy smoke on IMO-AnswerBench via minimax-m2.5."
