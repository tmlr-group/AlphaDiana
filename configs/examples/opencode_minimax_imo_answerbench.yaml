# SMOKE ONLY: deterministic 1-task config for path validation.
# Full benchmark config: configs/full_runs/p25_full_opencode_minimax_imo_answerbench.yaml.

run_id: "opencode_minimax_imo_smoke"

agent:
  name: opencode
  version: "1.3.2"
  config:
    model: "custom/minimax-m2.5"
    model_name: "minimax-m2.5"
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    controller_mode: "docker"
    controller_image: "alphadiana/tb2-opencode-controller:latest"
    timeout: 1800
    streaming: false
    tool_call: true
    agent: "lean-math"
    agent_md_path: "context/opencode_lean_math.md"
    system_prompt: |
      Solve efficiently and keep the response short.
      The final line must be $$\boxed{your answer here}$$.

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"
    dataset_index: 367
    max_tasks: 1

scorer:
  name: imo_verify

max_concurrent: 1
output_dir: "./results/opencode_minimax_imo_smoke"
metadata:
  notes: "OpenCode x IMO-AnswerBench smoke via minimax-m2.5."
