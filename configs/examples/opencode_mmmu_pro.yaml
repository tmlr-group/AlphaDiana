run_id: "opencode-mmmu-pro-001"

agent:
  name: opencode
  version: "1.3.2"
  config:
    model: "custom/minimax-m2.5"
    model_name: "minimax-m2.5"
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    controller_mode: "docker"
    controller_image: "alphadiana/tb2-opencode-controller:latest"
    timeout: 1800
    streaming: false
    tool_call: true
    system_prompt: |
      You are an expert at multiple-choice reasoning.
      Read the question carefully and select the single best option.

      Respond with the final answer on the last line as:
      $$\boxed{X}$$
      where X is the single correct option letter.

benchmark:
  name: mmmu_pro
  config:
    dataset: "MMMU/MMMU_Pro"
    data_config: "standard (4 options)"
    split: "test"
    # max_tasks: 100  # Uncomment to run a smaller subset

scorer:
  name: exact_match
  config: {}

max_concurrent: 1
output_dir: "./results/opencode_mmmu_pro"
metadata:
  notes: "OpenCode x MMMU-Pro smoke/debug config via minimax-m2.5"
