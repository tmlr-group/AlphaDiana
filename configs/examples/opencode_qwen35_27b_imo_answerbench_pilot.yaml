run_id: "pilot_20260419_qwen35_27b_imo_answerbench_opencode_t3"

agent:
  name: opencode
  version: "1.3.2"
  config:
    model: "custom/qwen/qwen3.5-27b"
    model_name: "qwen/qwen3.5-27b"
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    controller_mode: "docker"
    controller_image: "alphadiana/tb2-opencode-controller:latest"
    timeout: 1800
    streaming: false
    tool_call: false
    agent: "lean-math"
    agent_md_path: "context/opencode_lean_math.md"
    system_prompt: |
      Solve efficiently and keep the response short.
      The final line must be $$\boxed{your answer here}$$.

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"
    max_tasks: 3

scorer:
  name: imo_verify

max_concurrent: 3
output_dir: "./results/opencode_minimax_imo_smoke"
metadata:
  notes: "Qwen/Qwen3.5-27B x OpenRouter x IMO-AnswerBench 3-task pilot via opencode."
