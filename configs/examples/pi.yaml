agent:
  name: pi
  version: model-deployment-v1
  config:
    image: ${HARNESS_IMAGE}
    model: ${OPENAI_MODEL_NAME}
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    system_prompt: Solve the task using available tools.
    timeout: 120
benchmark:
  name: custom
  config:
    problems:
      - id: addition
        problem: What is 2 + 3? Return only the number.
        answer: '5'
scorer:
  name: exact_match
