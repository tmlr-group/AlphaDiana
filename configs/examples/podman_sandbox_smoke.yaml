# Optional Podman sandbox smoke config.
#
# This config documents the `sandbox.name: podman` opt-in shape. It does not
# claim benchmark support status by itself; support still requires real run
# evidence and task-level artifact inspection.

run_id: podman-sandbox-smoke

agent:
  name: direct_llm
  version: v1.0
  config:
    model: demo-model
    api_base: http://localhost:8000/v1
    api_key: EMPTY

benchmark:
  name: aime
  config:
    max_tasks: 1

sandbox:
  name: podman
  config:
    image: python:3.11
    command: ["sleep", "infinity"]
    workdir: /workspace
    name_prefix: alphadiana-podman-smoke

scorer:
  name: numeric
  config: {}

max_concurrent: 1
num_samples: 1
