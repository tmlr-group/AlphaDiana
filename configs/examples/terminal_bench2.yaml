# TerminalBench-2 smoke-test config — runs 5 file-operations tasks
# on A800 using DirectLLM (OpenAI-compatible) + Docker exec relay.
#
# Prerequisites:
#   1. Clone terminal-bench-2:
#        git clone --depth=1 https://github.com/harbor-framework/terminal-bench-2.git /path/to/terminal-bench-2
#        export TERMINAL_BENCH2_DIR=/path/to/terminal-bench-2
#
#   2. Pre-pull Docker images for file-operations tasks:
#        for task in db-wal-recovery extract-elf extract-moves-from-video remove-pii-from-csv rename-log-files; do
#          docker pull alexgshaw/${task}:20251031
#        done
#
#   3. Set environment variables (use OpenRouter or local vLLM):
#        export OPENAI_BASE_URL=https://openrouter.ai/api/v1
#        export OPENAI_API_KEY=sk-or-v1-...
#        export OPENAI_MODEL_NAME=deepseek/deepseek-chat-v3-0324
#
#   NOTE: tasks_dir points to repo root; categories filter selects file-operations tasks
#         via task.toml metadata.category field.

run_id: terminal_bench2_smoke

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_DIR}
    categories: ["file-operations"]
    max_tasks: 5

agent:
  name: terminal_bench2_docker
  version: "1.0"
  config:
    model: ${OPENAI_MODEL_NAME}
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    max_rounds: 20
    max_tokens: 2048
    test_timeout_sec: 900   # apt-get + uv install + pytest can take 5-10 min

scorer:
  name: terminal_bench2

max_concurrent: 1
output_dir: results/terminal_bench2_smoke
