# Legacy generic example. Prefer configs/examples/terminal_bench2_directllm_minimax.yaml
# for the current deterministic smoke path.
run_id: "terminal_bench2_example"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_SMOKE_DIR}
    max_tasks: 1

agent:
  name: terminal_bench2_docker
  version: "1.0"
  config:
    model: ${OPENAI_MODEL_NAME}
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    max_rounds: 20
    max_tokens: 4096
    timeout_sec: 900
    test_timeout_sec: 1200

scorer:
  name: terminal_bench2

max_concurrent: 1
output_dir: "./results/terminal_bench2_example"
