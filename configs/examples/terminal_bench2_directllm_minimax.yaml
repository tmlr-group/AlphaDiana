# SMOKE ONLY: deterministic 1-task config for path validation.
# Full benchmark config: configs/full_runs/p25_full_terminal_bench2_directllm_minimax.yaml.
#
# DirectLLM smoke for terminal-bench-2 via the shared control-side harness.
# Requires:
#   export TERMINAL_BENCH2_SMOKE_DIR=/path/to/staged-terminal-bench-smoke-root
#   docker pull alexgshaw/db-wal-recovery:20251031

run_id: "terminal_bench2_directllm_minimax_smoke"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_SMOKE_DIR}
    max_tasks: 1

agent:
  name: terminal_bench2_docker
  version: "1.0"
  config:
    model: "minimax-m2.5"
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    max_rounds: 6
    max_tokens: 4096
    timeout_sec: 900
    test_timeout_sec: 1200

scorer:
  name: terminal_bench2

max_concurrent: 1
output_dir: "./results/terminal_bench2_directllm_minimax_smoke"
metadata:
  notes: "DirectLLM smoke for terminal-bench-2 on a staged single-task root via minimax-m2.5."
