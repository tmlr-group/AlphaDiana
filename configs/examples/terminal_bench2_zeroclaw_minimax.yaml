# ZeroClaw native smoke for terminal-bench-2.
# Requires:
#   source scripts/activate.sh
#   export TERMINAL_BENCH2_SMOKE_DIR=/path/to/staged-terminal-bench-smoke-root
#   docker build -f docker/terminal_bench2/Dockerfile.zeroclaw-controller \
#     -t alphadiana/tb2-zeroclaw-controller:latest .

run_id: "terminal_bench2_zeroclaw_minimax_smoke"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_SMOKE_DIR}
    max_tasks: 1

agent:
  name: terminal_bench2_zeroclaw
  version: "0.6.9"
  config:
    model: "minimax-m2.5"
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    controller_mode: "docker"
    controller_image: "alphadiana/tb2-zeroclaw-controller:latest"
    zeroclaw_bin: "zeroclaw"
    solver_timeout_sec: 1800
    timeout_sec: 900
    test_timeout_sec: 1200

sandbox: null

scorer:
  name: terminal_bench2

max_concurrent: 1
output_dir: "./results/terminal_bench2_zeroclaw_minimax_smoke"
metadata:
  notes: "ZeroClaw native smoke for terminal-bench-2 on a staged single-task root via minimax-m2.5."
