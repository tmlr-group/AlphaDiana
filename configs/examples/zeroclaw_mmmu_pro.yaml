run_id: "zeroclaw_${OPENAI_MODEL_NAME}_mmmu_pro_smoke"

agent:
  name: zeroclaw
  version: "0.6.9"
  config:
    model: "${OPENAI_MODEL_NAME}"
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    rock_image: "zeroclaw-reasoning:0.6.9"
    rock_memory: "4g"
    rock_cpus: 1
    rock_startup_timeout: 600
    admin_base_url: "${ROCK_BASE_URL}"
    proxy_base_url: "${ROCK_PROXY_URL}"
    request_timeout: 2400
    max_tool_iterations: 100
    max_actions_per_hour: 200
    system_prompt: |
      You are solving MMMU-Pro multiple-choice questions. Inspect any workspace
      attachments referenced by the prompt before deciding.

      When you have reached your final answer, you MUST present it at the very
      end in the form:

      $$\boxed{your answer here}$$

benchmark:
  name: mmmu_pro
  config:
    dataset: "MMMU/MMMU_Pro"
    data_config: "vision"
    split: "test"
    max_tasks: 1

sandbox: null

scorer:
  name: exact_match

max_concurrent: 1
output_dir: "./results/zeroclaw_mmmu_pro_smoke"
metadata:
  notes: "ZeroClaw smoke config for MMMU-Pro vision subset via ROCK auto-deploy."
