# FULL RUN: all IMO-AnswerBench tasks in the configured split.
# For a 1-task liveness check, use configs/examples/openclaw_minimax_imo_answerbench.yaml.

run_id: "p25_full_openclaw_minimax_imo_answerbench"

agent:
  name: openclaw
  version: "2026.3.20"
  config:
    rock_image: "tmlrgroup/alphadiana:v1"
    rock_agent_config_path: "openclaw_deploy/rock_agent_config.prebuilt.yaml"
    openclaw_config_path: "openclaw_deploy/openclaw.json"
    rock_memory: "4g"
    rock_cpus: 1
    rock_startup_timeout: 600
    gateway_startup_timeout: 240
    gateway_warmup_timeout: 240
    OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    OPENAI_MODEL_NAME: "minimax-m2.5"
    model: openclaw
    gateway_token: "OPENCLAW"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    request_timeout: 1800
    stream_idle_timeout: 600
    max_attempts: 5
    system_prompt: |
      You are an expert mathematician. Solve the problem carefully.
      The final line must be:
      $$\boxed{your answer here}$$
benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"

sandbox: null

scorer:
  name: imo_verify

max_concurrent: 1
output_dir: "./results/p25_full_openclaw_minimax_imo_answerbench"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full OpenClaw auto-deploy run on IMO-AnswerBench via minimax-m2.5."
