# FULL RUN: all MMMU-Pro vision tasks.
# For smoke/debug usage, prefer configs/examples/openclaw_mmmu_pro.yaml.

run_id: "rollout_full_openclaw_mmmu_pro_vision"

agent:
  name: openclaw
  version: "2026.3.20"
  config:
    rock_image: "tmlrgroup/alphadiana:v1"
    rock_agent_config_path: "openclaw_deploy/rock_agent_config.prebuilt.yaml"
    openclaw_config_path: "openclaw_deploy/openclaw.json"
    rock_memory: "4g"
    rock_cpus: 1
    rock_startup_timeout: 600
    gateway_startup_timeout: 240
    gateway_warmup_timeout: 240
    OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME}"
    model: openclaw
    gateway_token: "OPENCLAW"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    request_timeout: 1800
    stream_idle_timeout: 600
    max_attempts: 5
    include_attachments: true
    system_prompt: |
      You are an expert at multimodal multiple-choice reasoning.
      Carefully analyze any provided images along with the question text and options.
      Think through the problem step by step before selecting your answer.
      Respond with the final answer on the last line as:
      $$\boxed{X}$$
      where X is the single correct option letter.

benchmark:
  name: mmmu_pro
  config:
    dataset: "MMMU/MMMU_Pro"
    data_config: "vision"
    split: "test"

sandbox: null

scorer:
  name: exact_match
  config: {}

max_concurrent: 1
num_samples: 1
output_dir: "./results/rollout_full_openclaw_mmmu_pro_vision"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full OpenClaw x MMMU-Pro vision config for the local-vLLM rollout matrix."
