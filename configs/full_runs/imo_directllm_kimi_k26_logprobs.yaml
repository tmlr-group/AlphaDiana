# FULL RUN: IMO-AnswerBench x DirectLLM on moonshotai/kimi-k2.6 via OpenRouter with logprob capture.

run_id: "full_imo_directllm_kimi_k26_logprobs"

agent:
  name: direct_llm
  version: "1.0"
  config:
    model: "moonshotai/kimi-k2.6"
    api_base: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    stream: true
    enable_thinking: true
    extra_body:
      reasoning:
        enabled: true
    system_prompt: |
      You are an expert mathematician. Solve the problem carefully.
      The final line must be:
      $$\boxed{your answer here}$$

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"

scorer:
  name: imo_verify
  config: {}

max_concurrent: 10
num_samples: 1
output_dir: "./results"
strict_report: true
strict_isolation: true
metadata:
  notes: "IMO-AnswerBench x DirectLLM on moonshotai/kimi-k2.6 via OpenRouter. enable_thinking=true, max_tokens=131072."
