# FULL RUN: all IMO-AnswerBench tasks in the configured split.
# For a 1-task liveness check, use configs/examples/directllm_minimax_imo_answerbench.yaml.

run_id: "p25_full_directllm_minimax_imo_answerbench"

agent:
  name: direct_llm
  version: "1.0"
  config:
    model: "minimax-m2.5"
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    temperature: 0.0
    top_p: 0.95
    max_tokens: 32768
    stream: true
    system_prompt: |
      You are an expert mathematician. Solve the problem carefully.

      The final line must be:
      $$\boxed{your answer here}$$

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"

scorer:
  name: imo_verify

max_concurrent: 20
output_dir: "./results/p25_full_directllm_minimax_imo_answerbench"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full DirectLLM x IMO-AnswerBench run via minimax-m2.5."
