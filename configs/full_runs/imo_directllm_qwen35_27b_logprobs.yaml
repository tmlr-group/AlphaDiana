# FULL RUN: IMO-AnswerBench x DirectLLM on local Qwen/Qwen3.5-27B with logprob capture.

run_id: "full_imo_directllm_qwen35_27b_logprobs"

agent:
  name: direct_llm
  version: "1.0"
  config:
    model: "Qwen/Qwen3.5-27B"
    api_base: "http://127.0.0.1:8011/v1"
    api_key: "EMPTY"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    stream: true
    capture_logprobs: true
    top_logprobs: 20
    logprobs_format: "int16"
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
    system_prompt: |
      You are an expert mathematician. Solve the problem carefully.
      The final line must be:
      $$\boxed{your answer here}$$

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"

scorer:
  name: imo_verify
  config: {}

max_concurrent: 10
num_samples: 1
output_dir: "./results"
strict_report: true
strict_isolation: true
metadata:
  notes: "Canonical full IMO-AnswerBench DirectLLM config after prompt alignment."
