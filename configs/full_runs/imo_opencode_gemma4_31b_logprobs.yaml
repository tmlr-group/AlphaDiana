# FULL RUN: IMO-AnswerBench x OpenCode on local google/gemma-4-31b-it with logprob capture.

run_id: "full_imo_opencode_gemma4_31b_logprobs"

agent:
  name: opencode
  version: "1.3.2"
  config:
    model: "custom/google/gemma-4-31b-it"
    model_name: "google/gemma-4-31b-it"
    api_base: "http://127.0.0.1:8011/v1"
    api_key: "EMPTY"
    controller_mode: "docker"
    controller_network: "host"
    controller_image: "alphadiana/tb2-opencode-controller:latest"
    timeout: 9300
    streaming: true
    tool_call: true
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    enable_thinking: true
    capture_logprobs: true
    top_logprobs: 20
    system_prompt: |
      You are an expert mathematician. When given a problem, actively use your available tools and skills throughout your reasoning process. Do not attempt to solve problems purely in your head when tools can help. Use code execution, search, or any other available capabilities to verify intermediate steps, explore approaches, and confirm your final answer.

      Solve the problem carefully.

      When you have reached your final answer, you MUST present it in the following format:

      $$\boxed{your answer here}$$

      Do not skip the boxed format. The boxed answer must appear at the very end of your response and contain only the final answer, not explanations.

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"

scorer:
  name: imo_verify
  config: {}

max_concurrent: 10
num_samples: 1
output_dir: "./results"
strict_report: true
strict_isolation: true
metadata:
  notes: "Canonical full IMO-AnswerBench OpenCode config after prompt alignment."
