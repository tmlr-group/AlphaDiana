run_id: full_imo_zeroclaw_qwen35_27b_logprobs
agent:
  name: zeroclaw
  version: 0.6.9
  config:
    model: Qwen/Qwen3.5-27B
    api_base: http://host.docker.internal:8011/v1
    api_key: EMPTY
    provider_api_base: http://host.docker.internal:8011/v1
    provider_api_key: EMPTY
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    enable_thinking: true
    request_timeout: 9300
    runtime_trace_mode: full
    capture_logprobs: true
    top_logprobs: 20
    max_tool_iterations: 100
    max_actions_per_hour: 200
    rock_image: zeroclaw-reasoning:0.6.9
    rock_memory: 4g
    rock_cpus: 1
    rock_startup_timeout: 600
    system_prompt: |-
      You are an expert mathematician. When given a problem, actively use your available tools and skills throughout your reasoning process. Do not attempt to solve problems purely in your head when tools can help. Use code execution, search, or any other available capabilities to verify intermediate steps, explore approaches, and confirm your final answer.

      Solve the problem carefully.

      When you have reached your final answer, you MUST present it in the following format:

      $$\boxed{your answer here}$$

      Do not skip the boxed format. The boxed answer must appear at the very end of your response and contain only the final answer, not explanations.
benchmark:
  name: imo_answerbench
  config:
    dataset: Hwilner/imo-answerbench
    split: train
sandbox: null
scorer:
  name: imo_verify
  config: {}
max_concurrent: 2
num_samples: 1
task_retries: 2
output_dir: ./results
strict_report: true
strict_isolation: true
metadata:
  notes: Canonical full IMO-AnswerBench zeroclaw config after prompt alignment.
