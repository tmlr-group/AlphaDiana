# FULL RUN: MMMU-Pro vision x DirectLLM on moonshotai/kimi-k2.6 via OpenRouter with logprob capture.

run_id: "full_mmmu_pro_directllm_kimi_k26_logprobs"

agent:
  name: direct_llm
  version: "1.0"
  config:
    model: "moonshotai/kimi-k2.6"
    api_base: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    stream: true
    enable_thinking: true
    extra_body:
      reasoning:
        enabled: true
    system_prompt: |
      You are an expert at multimodal multiple-choice reasoning.
      Carefully analyze any provided images along with the question text and options.
      Think through the problem step by step before selecting your answer.
      Respond with the final answer on the last line as:
      $$\boxed{X}$$
      where X is the single correct option letter.

benchmark:
  name: mmmu_pro
  config:
    dataset: "MMMU/MMMU_Pro"
    data_config: "vision"
    split: "test"

scorer:
  name: exact_match
  config: {}

max_concurrent: 10
num_samples: 1
output_dir: "./results"
strict_report: true
strict_isolation: true
metadata:
  notes: "MMMU-Pro vision x DirectLLM on moonshotai/kimi-k2.6 via OpenRouter. enable_thinking=true, max_tokens=131072."
