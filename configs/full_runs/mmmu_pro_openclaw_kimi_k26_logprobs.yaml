run_id: full_mmmu_pro_openclaw_kimi_k26_logprobs
agent:
  name: openclaw
  version: 2026.3.20
  config:
    rock_image: tmlrgroup/alphadiana:v1
    rock_agent_config_path: openclaw_deploy/rock_agent_config.prebuilt.yaml
    openclaw_config_path: openclaw_deploy/openclaw_kimi.json
    rock_memory: 4g
    rock_cpus: 1
    rock_startup_timeout: 600
    gateway_startup_timeout: 240
    gateway_warmup_timeout: 240
    OPENAI_BASE_URL: https://openrouter.ai/api/v1
    OPENAI_API_KEY: ${OPENROUTER_API_KEY}
    OPENAI_MODEL_NAME: moonshotai/kimi-k2.6
    model: openclaw
    gateway_token: OPENCLAW
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    enable_thinking: true
    stream: true
    request_timeout: 9300
    stream_idle_timeout: 1800
    stream_total_timeout: 9000
    max_attempts: 5
    system_prompt: |-
      You are an expert at multimodal multiple-choice reasoning. When given a question, actively use your available tools and skills throughout your reasoning process. Do not attempt to answer purely in your head when tools can help. Use code execution, search, or any other available capabilities to verify intermediate steps, explore approaches, and confirm your final answer.

      Carefully analyze any provided images along with the question text and options. Think through the problem step by step before selecting your answer.

      When you have reached your final answer, you MUST present it on the last line in exactly this format:

      $$\boxed{X}$$

      where X is the single correct option letter.

      Do not skip the boxed format. The boxed answer must contain only the option letter, not the option text, explanations, or a full sentence.
    include_attachments: true
benchmark:
  name: mmmu_pro
  config:
    dataset: MMMU/MMMU_Pro
    data_config: vision
    split: test
sandbox: null
scorer:
  name: exact_match
  config: {}
max_concurrent: 10
num_samples: 1
output_dir: ./results
strict_report: true
strict_isolation: true
metadata:
  notes: MMMU-Pro vision x OpenClaw on moonshotai/kimi-k2.6 via OpenRouter. enable_thinking=true, max_tokens=131072.
