# FULL RUN: all IMO-AnswerBench tasks in the configured split.
# For a 1-task liveness check, use configs/examples/opencode_minimax_imo_answerbench.yaml.

run_id: "p25_full_opencode_minimax_imo_answerbench"

agent:
  name: opencode
  version: "1.3.2"
  config:
    model: "custom/minimax-m2.5"
    model_name: "minimax-m2.5"
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    controller_mode: "docker"
    controller_image: "alphadiana/tb2-opencode-controller:latest"
    timeout: 1800
    streaming: true
    tool_call: true
    agent: "lean-math"
    agent_md_path: "context/opencode_lean_math.md"
    system_prompt: |
      You are an expert mathematician. Solve the problem carefully.
      The final line must be:
      $$\boxed{your answer here}$$
benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"

scorer:
  name: imo_verify

max_concurrent: 20
output_dir: "./results/p25_full_opencode_minimax_imo_answerbench"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full OpenCode x IMO-AnswerBench run via minimax-m2.5 with Docker controller isolation."
