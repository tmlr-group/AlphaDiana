# FULL RUN: all local terminal-bench task directories under TERMINAL_BENCH2_DIR.
# For a 1-task liveness check, use configs/examples/terminal_bench2_opencode_minimax.yaml.

run_id: "p25_full_terminal_bench2_opencode_minimax"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_DIR}

agent:
  name: terminal_bench2_opencode
  version: "1.0"
  config:
    model: "custom/${OPENAI_MODEL_NAME}"
    model_name: ${OPENAI_MODEL_NAME}
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    runtime_source_image: "alphadiana/tb2-opencode-controller:latest"
    tool_call: true
    streaming: true
    solver_timeout_sec: 1800
    timeout_sec: 900
    test_timeout_sec: 1200

scorer:
  name: terminal_bench2

max_concurrent: 2
output_dir: "./results/p25_full_terminal_bench2_opencode_minimax"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full OpenCode in-container run for terminal-bench-2 via OPENAI_MODEL_NAME. Pre-pull task Docker images first."
