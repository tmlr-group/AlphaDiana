# FULL RUN: all IMO-AnswerBench tasks.
# For a 1-task liveness check, use configs/examples/zeroclaw_imo_answerbench.yaml.

run_id: "p25_full_zeroclaw_minimax_imo_answerbench"

agent:
  name: zeroclaw
  version: "0.6.9"
  config:
    model: "minimax-m2.5"
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    temperature: 0.0
    rock_image: "zeroclaw-reasoning:0.6.9"
    rock_memory: "4g"
    rock_cpus: 1
    rock_startup_timeout: 600
    admin_base_url: "${ROCK_BASE_URL}"
    proxy_base_url: "${ROCK_PROXY_URL}"
    request_timeout: 1800
    max_tool_iterations: 100
    max_actions_per_hour: 200
    system_prompt: |
      Solve carefully and verify your derivation when tools help.

      The final line must be:
      $$\boxed{your answer here}$$

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"

sandbox: null

scorer:
  name: imo_verify

max_concurrent: 1
output_dir: "./results/p25_full_zeroclaw_minimax_imo_answerbench"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full ZeroClaw auto-deploy run on IMO-AnswerBench via minimax-m2.5."
