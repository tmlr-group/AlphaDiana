campaign_id: "rollout_local_vllm_20260419"
title: "Full 5-benchmark x 4-harness x 3-model local-vLLM rollout"
defaults:
  run_id_prefix: "full_20260419"
  logs_dir: "logs"
  results_dir: "./results"
  rollout_semantics:
    temperature: 0.0
    top_p: 0.95
    max_tokens: 32768
    streaming: true
    timeout_sec: 1800
    thinking: true
excluded_benchmarks:
  - benchmark: "swebench_pro"
    reason: "SWE-bench Pro scorer/evaluator health is out of scope for the current rollout"

models:
  - id: "qwen35_27b"
    model_name: "Qwen/Qwen3.5-27B"
    api_base_env: "QWEN_VLLM_API_BASE"
    api_key_env: "QWEN_VLLM_API_KEY"
    official_model_name: "openai/Qwen/Qwen3.5-27B"
    supports_multimodal: true
  - id: "gemma4_31b_it"
    model_name: "google/gemma-4-31B-it"
    api_base_env: "GEMMA4_VLLM_API_BASE"
    api_key_env: "GEMMA4_VLLM_API_KEY"
    official_model_name: "openai/google/gemma-4-31B-it"
    supports_multimodal: true
  - id: "nemotron_30b_a3b"
    model_name: "nvidia/nemotron-3-nano-30b-a3b"
    api_base_env: "NEMOTRON_VLLM_API_BASE"
    api_key_env: "NEMOTRON_VLLM_API_KEY"
    official_model_name: "openai/nvidia/nemotron-3-nano-30b-a3b"
    supports_multimodal: false

path_templates:
  - id: "imo_answerbench_direct_llm"
    benchmark: "imo_answerbench"
    harness: "direct_llm"
    backend: "alphadiana"
    config_path: "configs/full_runs/p25_full_directllm_minimax_imo_answerbench.yaml"
    max_concurrent: 10
    base_wave: "wave_a_mainline"
    base_risk: "mainline"
    config_gaps:
      - "thinking knob not forwarded on the direct_llm path"
    overrides:
      run_id: "{run_id}"
      output_dir: "./results/{run_id}"
      max_concurrent: 10
      agent.config.model: "{model_name}"
      agent.config.api_base: "{api_base_env_ref}"
      agent.config.api_key: "{api_key_env_ref}"
      agent.config.temperature: 0.0
      agent.config.top_p: 0.95
      agent.config.max_tokens: 32768
      agent.config.stream: true

  - id: "imo_answerbench_openclaw"
    benchmark: "imo_answerbench"
    harness: "openclaw"
    backend: "alphadiana"
    config_path: "configs/full_runs/p25_full_openclaw_minimax_imo_answerbench.yaml"
    max_concurrent: 1
    base_wave: "wave_a_mainline"
    base_risk: "mainline"
    config_gaps:
      - "no explicit thinking knob on the generic openclaw path"
    overrides:
      run_id: "{run_id}"
      output_dir: "./results/{run_id}"
      max_concurrent: 1
      agent.config.OPENAI_BASE_URL: "{api_base_env_ref}"
      agent.config.OPENAI_API_KEY: "{api_key_env_ref}"
      agent.config.OPENAI_MODEL_NAME: "{model_name}"
      agent.config.temperature: 0.0
      agent.config.top_p: 0.95
      agent.config.max_tokens: 32768
      agent.config.request_timeout: 1800
      agent.config.stream_idle_timeout: 600

  - id: "imo_answerbench_opencode"
    benchmark: "imo_answerbench"
    harness: "opencode"
    backend: "alphadiana"
