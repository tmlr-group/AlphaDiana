# FULL RUN: SWE-bench Verified-Mini via `swebench_docker` in OpenClaw mode.
# Dataset: MariusHobbhahn/swe-bench-verified-mini (50 tasks).
# For the upstream / leaderboard-aligned path, use the `swe_verified_mini.yaml`
# campaign manifest with backend=official_swebench_verified instead.

run_id: "full_swe_verified_mini_openclaw_qwen35_27b_logprobs"

agent:
  name: swebench_docker
  version: "1.0"
  config:
    agent_type: openclaw
    system_prompt: "You are a helpful assistant that can interact with a computer to solve tasks."
    request_timeout: 3600
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    capture_logprobs: true
    top_logprobs: 20
    output_dir: "./swebench_artifacts_openclaw_verified_mini"
    env:
      OPENAI_API_KEY: "EMPTY"
      OPENAI_BASE_URL: "http://127.0.0.1:8011/v1"
      OPENAI_MODEL_NAME: "Qwen/Qwen3.5-27B"
      OPENCLAW_AGENT_TIMEOUT_SEC: "1200"
      OPENCLAW_CHAT_MAX_TIME_SEC: "1260"
      OPENCLAW_CONTEXT_WINDOW: "262144"
      OPENCLAW_COMPLETION_MAX_TOKENS: "131072"
      OPENCLAW_PROMPT_PROFILE: "swebench"
      OPENCLAW_AGENT_ID: "openclaw_swebench_verified_mini"
      OPENCLAW_TOOLS_PROFILE: "swebench"
      OPENCLAW_REQUIRE_PATCH: "true"
      OPENCLAW_MAX_TOOL_CALLS_WITHOUT_EDIT: "30"
      OPENCLAW_MAX_NO_EDIT_SECONDS: "600"

benchmark:
  name: swe_bench
  config:
    dataset: "MariusHobbhahn/swe-bench-verified-mini"
    split: test

scorer:
  name: swe_bench
  config:
    timeout: 3600
    namespace: swebench
    arch: x86_64

max_concurrent: 10
num_samples: 1
output_dir: "./results/full_swe_verified_mini_openclaw_qwen35_27b_logprobs"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full SWE-bench Verified-Mini OpenClaw run on local Qwen3.5-27B vLLM with top-20 int16 logprob capture."
