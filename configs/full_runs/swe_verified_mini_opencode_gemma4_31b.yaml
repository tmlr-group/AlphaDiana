# SWE-Bench Verified-Mini x OpenCode x google/gemma-4-31B-it.
# Execute from the AlphaDiana checkout root. Provider credentials are injected
# at runtime; do not replace them with real secrets in this file.

run_id: "full_swe_bench_verified_mini_opencode_gemma4_31b_v01"

agent:
  name: opencode
  version: "1.3.2"
  config:
    runtime: "swebench_container"
    api_base: "${SWE_CONTAINER_OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model_name: "google/gemma-4-31B-it"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 131072
    enable_thinking: true
    streaming: true
    tool_call: true
    timeout: 3600
    capture_logprobs: false
    permission:
      edit: "deny"
      bash: "allow"
    system_prompt: |
      You are an expert software engineer. You will be given a GitHub issue
      description for a repository. Fix the issue by making the minimal
      necessary code changes.

      Use your file reading, search, shell, and editing tools to inspect and
      modify the checked-out repository. Do not modify tests unless the issue
      explicitly requires a test change. Run focused checks when practical.
      Leave the working tree with the intended fix and avoid unrelated changes.

benchmark:
  name: swe_bench
  config:
    dataset: "MariusHobbhahn/swe-bench-verified-mini"
    split: "test"
    include_hints: false

sandbox:
  name: swebench_container
  config:
    container_engine: docker
    namespace: "swebench"
    docker_build_network: "host"
    force_rebuild: false
    keep_container: false
    keep_logs: true
    log_dir: "./logs/swe-bench-verified-mini/opencode/task-containers"
    gateway_host: "127.0.0.1"
    gateway_port: 8080

scorer:
  name: swe_bench
  config:
    timeout: 7200
    cache_level: "env"
    container_engine: docker
    namespace: "swebench"
    docker_build_network: "host"
    force_rebuild: false
    log_dir: "./logs/swe-bench-verified-mini/opencode/evaluation"

max_concurrent: 4
num_samples: 1
task_retries: 0
output_dir: "./results"
strict_report: true
strict_isolation: true
metadata:
  benchmark_display_name: "SWE-Bench-Verified-Mini"
  model_hf_id: "google/gemma-4-31B-it"
  max_model_length: 262144
  presence_penalty: 1.5
  streaming: true
  thinking: true
  hf_repo: "T-MARS/alphadiana-benchmark-results"
  hf_folder_pattern: "YYYYMMDD-swe_bench_verified_mini-opencode-gemma-4-31b-it-vNN"
  runtime_note: "Current AlphaDiana task-container adapter installs opencode-ai@latest; preserve the reported CLI version in uploaded artifacts."
