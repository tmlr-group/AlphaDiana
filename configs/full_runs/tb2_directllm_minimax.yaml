# FULL RUN: all local terminal-bench task directories under TERMINAL_BENCH2_DIR.
# For a 1-task liveness check, use configs/examples/terminal_bench2_directllm_minimax.yaml.

run_id: "p25_full_terminal_bench2_directllm_minimax"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_DIR}

agent:
  name: terminal_bench2_docker
  version: "1.0"
  config:
    model: "minimax-m2.5"
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    temperature: 0.0
    max_rounds: 8
    max_tokens: 131072
    timeout_sec: 900
    test_timeout_sec: 1200

scorer:
  name: terminal_bench2

max_concurrent: 4
output_dir: "./results/p25_full_terminal_bench2_directllm_minimax"
strict_report: true
strict_isolation: true
metadata:
  notes: "Full DirectLLM run for terminal-bench-2 via minimax-m2.5. Pre-pull task Docker images first."
