run_id: macro_imo_answerbench_openclaw_qwen35_27b
agent:
  name: openclaw
  version: 2026.3.14
  config:
    rock_image: tmlrgroup/alphadiana:v1
    rock_agent_config_path: alphadiana/harness/openclaw/deploy/rock_agent_config.prebuilt.yaml
    openclaw_config_path: alphadiana/harness/openclaw/deploy/openclaw.json
    rock_memory: 4g
    rock_cpus: 1
    rock_startup_timeout: 600
    gateway_startup_timeout: 240
    gateway_warmup_timeout: 240
    OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME}"
    model: openclaw
    gateway_token: "${OPENCLAW_GATEWAY_TOKEN}"
    temperature: 0.0
    top_p: 0.95
    max_tokens: 32768
    request_timeout: 9300
    max_attempts: 5
    system_prompt: |
      You are an expert problem solver. Use available tools when they help.

      The final line must be:
      $$\boxed{your answer here}$$
    stream_total_timeout: 9000
    enable_thinking: true
benchmark:
  name: imo_answerbench
  config:
    dataset: Hwilner/imo-answerbench
    split: train
sandbox: null
scorer:
  name: imo_verify
max_concurrent: 1
num_samples: 1
output_dir: ./results
strict_report: true
strict_isolation: true
metadata:
  model_family: Qwen3.5-27B
  experiment_axis: macro
  notes: 'Release macro config: IMO-AnswerBench x openclaw x Qwen3.5-27B.'
