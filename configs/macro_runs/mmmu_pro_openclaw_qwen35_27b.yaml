run_id: macro_mmmu_pro_openclaw_qwen35_27b
agent:
  name: openclaw
  version: 2026.3.14
  config:
    rock_image: tmlrgroup/alphadiana:v1
    rock_agent_config_path: alphadiana/harness/openclaw/deploy/rock_agent_config.prebuilt.yaml
    openclaw_config_path: alphadiana/harness/openclaw/deploy/openclaw.json
    rock_memory: 4g
    rock_cpus: 1
    rock_startup_timeout: 600
    gateway_startup_timeout: 240
    gateway_warmup_timeout: 240
    OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME}"
    model: openclaw
    gateway_token: "${OPENCLAW_GATEWAY_TOKEN}"
    max_tokens: 32768
    request_timeout: 9300
    max_attempts: 5
    include_attachments: true
    system_prompt: |
      You are an expert at multimodal multiple-choice reasoning.
      Carefully analyze any provided images along with the question text and options.
      Think through the problem step by step before selecting your answer.
      Respond with the final answer on the last line as:
      $$\boxed{X}$$
      where X is the single correct option letter.
    temperature: 0.0
    top_p: 0.95
    stream_total_timeout: 9000
    enable_thinking: true
benchmark:
  name: mmmu_pro
  config:
    dataset: MMMU/MMMU_Pro
    data_config: vision
    split: test
sandbox: null
scorer:
  name: exact_match
  config: {}
max_concurrent: 1
num_samples: 1
output_dir: ./results
strict_report: true
strict_isolation: true
metadata:
  model_family: Qwen3.5-27B
  experiment_axis: macro
  notes: 'Release macro config: MMMU-Pro x openclaw x Qwen3.5-27B.'
