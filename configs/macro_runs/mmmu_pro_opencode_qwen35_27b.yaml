run_id: macro_mmmu_pro_opencode_qwen35_27b
agent:
  name: opencode
  version: 1.3.2
  config:
    model: "custom/${OPENAI_MODEL_NAME}"
    model_name: "${OPENAI_MODEL_NAME}"
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    controller_mode: docker
    controller_image: alphadiana/tb2-opencode-controller:latest
    timeout: 1800
    streaming: false
    tool_call: true
    system_prompt: |
      You are an expert at multiple-choice reasoning.
      Read the question carefully and select the single best option.

      Respond with the final answer on the last line as:
      $$\boxed{X}$$
      where X is the single correct option letter.
    temperature: 0.0
    top_p: 0.95
    max_tokens: 32768
    enable_thinking: true
benchmark:
  name: mmmu_pro
  config:
    dataset: MMMU/MMMU_Pro
    data_config: vision
    split: test
scorer:
  name: exact_match
  config: {}
max_concurrent: 1
num_samples: 1
output_dir: ./results
strict_report: true
strict_isolation: true
metadata:
  model_family: Qwen3.5-27B
  experiment_axis: macro
  notes: 'Release macro config: MMMU-Pro x opencode x Qwen3.5-27B.'
