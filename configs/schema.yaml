# AlphaDiana Experiment Configuration Schema
#
# All experiments are defined by a single YAML file with the following structure.

# run_id: (optional) Unique identifier for this run. Auto-generated if omitted.
run_id: string

# agent: (required) Agent system configuration.
agent:
  name: string        # Agent name, e.g. "openclaw", "direct_llm", "zeroclaw", "swebench_docker"
  version: string     # Required label containing at least one digit, e.g. "1.0" or "0.6.9"
  config:             # Pass-through config for the agent (model settings, etc.)
    runtime: string                  # Optional runtime selector, e.g. "swebench_container"
    container_engine: string         # Task-container engine: "docker" legacy/baseline or opt-in "podman"
    container_engine_binary: string  # Optional explicit Docker/Podman executable path
    agent_type: string               # `swebench_docker` mode: "direct_llm" | "openclaw" | "opencode" | "zeroclaw"
    model: string
    model_name: string
    api_base: string
    gateway_token: string            # OpenClaw gateway auth token; set a strong value (the legacy "OPENCLAW" default fails security preflight)
    rock_agent_config_path: string   # Path to ROCK agent config YAML
    openclaw_config_path: string     # Path to OpenClaw gateway config JSON
    rock_use_kata_runtime: boolean   # Auto-deployed ROCK sandboxes: enable Kata runtime instead of --privileged
    rock_limit_cpus: float           # Auto-deployed ROCK sandboxes: optional hard CPU cap
    container_gateway_host: string   # Published host for task-local OpenClaw gateway
    container_gateway_port: integer  # Gateway port inside the task container
    install_openclaw_command: string
    openclaw_bin: string
    opencode_bin: string
    zeroclaw_bin: string
    api_key: string
    dockerhub_repo: string           # `swebench_docker` image repo prefix (default: "jefzda/sweap-images")
    image: string                    # Explicit SWE-bench image override
    output_dir: string               # Local artifact directory for Docker-backed agents
    temperature: float
    max_tokens: integer
    max_attempts: integer            # Retry attempts; generic OpenClaw default: 5
    request_timeout: float           # Harness-specific: DirectLLM 600s, OpenClaw 1800s, ZeroClaw 1200s
    bridge_port: integer             # ZeroClaw Podman bridge listener, exposure, probe, and API port
    runtime_trace_mode: string       # ZeroClaw trace mode (default: "none")
    max_tool_iterations: integer     # ZeroClaw max tool iterations (default: 100)
    max_actions_per_hour: integer    # ZeroClaw autonomy action budget (default: 200)
    timeout_sec: integer
    test_timeout_sec: integer
    solver_timeout_sec: integer
    onboard_timeout_sec: integer
    logs_base_dir: string
    controller_mode: string          # OpenCode: "podman" preferred for standard reasoning; "host" and "docker" are legacy/baseline
    controller_image: string         # OpenCode controller image for controller_mode=podman|docker; podman default is alphadiana-opencode-podman:latest
    controller_network: string       # OpenCode controller network, e.g. "host"
    controller_mount_docker_socket: boolean
    agent_md_mode: string            # Agent.md customization: "none", "append", "override" (default: "none")
    agent_md_content: string         # Content for agent.md injection
    embedding_api_base: string       # Embedding model API base URL
    embedding_api_key: string        # Embedding model API key
    install_command: string          # Optional CLI install command for sandbox/local runtime
    stream: boolean                  # Stream responses from the backend when supported
    streaming: boolean               # CLI agents: provider streaming toggle
    skip_bootstrap: boolean          # OpenClaw: skip workspace bootstrap injection
    context_injection: string        # OpenClaw: workspace bootstrap injection policy
    system_prompt_override: string   # OpenClaw: replace the gateway system prompt
    tools_profile: string            # OpenClaw: gateway tool profile, e.g. "minimal"
    tools_allow: [string]            # OpenClaw: explicit tool allowlist
    tools_deny: [string]             # OpenClaw: explicit tool denylist
    tool_call: boolean
    thinking: string
    verbose: string
    env:                             # Nested env contract for `swebench_docker` OpenClaw/OpenCode/ZeroClaw modes
      OPENAI_MODEL_NAME: string      # Required for `agent_type: openclaw|opencode|zeroclaw`
      OPENAI_BASE_URL: string        # Required for `agent_type: openclaw|opencode|zeroclaw`
      OPENAI_API_KEY: string         # Required for `agent_type: openclaw|opencode|zeroclaw`
      OPENCLAW_GATEWAY_TOKEN: string
      OPENCLAW_AGENT_TIMEOUT_SEC: string
      OPENCLAW_CHAT_MAX_TIME_SEC: string
      OPENCODE_TIMEOUT_SEC: string
      ZEROCLAW_TIMEOUT_SEC: string
    # For `swebench_docker`:
    #   - `agent_type: direct_llm` uses top-level `model/api_base/api_key`
    #   - `agent_type: openclaw|opencode|zeroclaw` uses nested `config.env.OPENAI_*`

# benchmark: (required) Benchmark configuration.
benchmark:
  name: string        # e.g. "aime", "gpqa_diamond", "hle", "mmmu_pro", "imo_answerbench", "swe_bench", "swebench_pro_os", "terminal_bench2", "decodingtrust", "custom"
  config:             # Benchmark-specific params
    split: string
    year: string
    subset: string
    data_path: string
    baseline_json_path: string
    distortion_threshold: float
    retention_threshold: float
    max_attempts: integer
    attempt_timeout_sec: integer
    total_timeout_sec: integer

# sandbox: (optional) Execution environment. Set to null if not needed.
sandbox:
  name: string        # "local", "rock", "podman", "swebench_container", or "decodingtrust"
  config:             # Sandbox-specific params
    # ROCK SDK config
    admin_base_url: string          # ROCK admin server URL (e.g. "http://localhost:9000")
    proxy_base_url: string          # ROCK proxy server URL (e.g. "http://localhost:9001")
    image: string                   # Docker image (default: "python:3.11")
    memory: string                  # Memory limit, e.g. "2g", "512m" (default: "2g")
    cpus: float                     # CPU limit (default: 0.5)
    limit_cpus: float               # Optional hard CPU cap passed through to ROCK
    startup_timeout: integer        # Sandbox startup timeout in seconds (ROCK/Podman)
    auto_clear_seconds: integer     # Auto-cleanup timeout in seconds (default: 3600)
    start_retries: integer          # Number of startup retries (default: 1)
    reset_between_tasks: boolean    # Reset workspace between tasks (default: true)
    proxy_timeout: integer          # Proxy timeout in seconds (default: 600)
    use_kata_runtime: boolean       # Enable Kata runtime instead of ROCK's default privileged Docker mode
    # SWE-bench official container backend
    container_engine: string         # "docker" legacy/baseline or opt-in "podman" via Docker-compatible Podman socket
    namespace: string               # swebench image namespace (default: "swebench")
    force_rebuild: boolean          # Force rebuilding the official instance image
    keep_container: boolean         # Keep the task container after the run
    keep_logs: boolean              # Persist container/build logs locally
    log_dir: string                 # Local log directory for backend artifacts
    gateway_host: string            # Host address for published task-container ports
    gateway_port: integer           # Port to publish for the in-container OpenClaw gateway
    # Generic sandbox config
    endpoint: string
    api_key: string
    workdir: string
    # Podman sandbox backend (`sandbox.name: podman`)
    command: [string]                # Container command, default: ["sleep", "infinity"]
    env: object                      # Environment passed to the Podman container
    ports: object                    # Container port -> host port mapping, e.g. {8080: 18080}
    network: string                  # Optional Podman network mode/name
    remove: boolean                  # Optional cleanup hint; AlphaDiana still owns close() cleanup
    name_prefix: string              # Container name prefix, default: "alphadiana-podman"
    stop_timeout: integer            # Podman stop timeout in seconds
    podman_socket: string            # Optional Unix Podman socket path for Docker API compatibility

# scorer: (required) Scoring method configuration.
scorer:
  name: string        # Scorer name, e.g. "exact_match", "numeric", "llm_judge"
  config:             # Scorer-specific params
    tolerance: float
    judge_model: string
    api_base: string
    api_key: string
    eval_script_path: string        # Required when scorer.name == "swebench_pro"
    scripts_dir: string             # Required when scorer.name == "swebench_pro"
    dockerhub_username: string      # Optional override for SWE-bench evaluator image namespace
    python_bin: string              # Optional interpreter for `swe_bench_pro_eval.py`
    use_local_docker: boolean
    docker_platform: string
    block_network: boolean
    num_workers: integer
    redo: boolean

# max_concurrent: (optional, default=1) Number of parallel task executions.
max_concurrent: integer

# num_samples: (optional, default=1) Number of independent samples per task for pass@k evaluation.
# When num_samples > 1, each task is solved k times independently, and pass@k is reported
# as the fraction of tasks where at least 1 of k samples is correct.
num_samples: integer

# output_dir: (optional, default="./results") Directory for result output.
output_dir: string

# Run-control fields.
redo_all: boolean                         # default false; bypass checkpoint when true
sandbox_retries: integer                  # default 1; sandbox startup retry budget
task_retries: integer                     # YAML-loader default 0; per-item retry budget
task_retry_on_recoverable_only: boolean   # default false
strict_report: boolean                    # default false; non-zero exit for incomplete/invalid reports
strict_isolation: boolean                 # default false; fail closed on supported ROCK setup failures

# DecodingTrust multi-process isolation. Other paths normally leave these at defaults.
parallel_strategy: string                 # "process_shards" enables isolated child processes
process_shards: integer                   # default 1; must be >= 1

# metadata: (optional) Free-form tags for tracking experiments.
metadata:
  author: string
  gpu: string
  notes: string
