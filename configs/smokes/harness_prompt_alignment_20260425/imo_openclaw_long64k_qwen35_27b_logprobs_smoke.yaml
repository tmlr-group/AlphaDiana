run_id: phase12_openclaw_imo_t3_thinking_on_long64k_logprobs_20260425
agent:
  name: openclaw
  version: 2026.3.20
  config:
    rock_image: tmlrgroup/alphadiana:v1
    rock_agent_config_path: alphadiana/harness/openclaw/deploy/rock_agent_config.prebuilt.yaml
    openclaw_config_path: alphadiana/harness/openclaw/deploy/openclaw.json
    rock_memory: 4g
    rock_cpus: 1
    rock_startup_timeout: 600
    gateway_startup_timeout: 240
    gateway_warmup_timeout: 240
    OPENAI_BASE_URL: http://127.0.0.1:8011/v1
    OPENAI_API_KEY: EMPTY
    OPENAI_MODEL_NAME: Qwen/Qwen3.5-27B
    model: openclaw
    gateway_token: OPENCLAW
    temperature: 0.0
    top_p: 0.95
    max_tokens: 65536
    enable_thinking: true
    stream: true
    request_timeout: 9300
    stream_idle_timeout: 600
    stream_total_timeout: 9000
    max_attempts: 5
    capture_logprobs: true
    top_logprobs: 20
    system_prompt: |-
      You are an expert mathematician. When given a problem, actively use your available tools and skills throughout your reasoning process. Do not attempt to solve problems purely in your head when tools can help. Use code execution, search, or any other available capabilities to verify intermediate steps, explore approaches, and confirm your final answer.

      Solve the problem carefully.

      When you have reached your final answer, you MUST present it in the following format:

      $$\boxed{your answer here}$$

      Do not skip the boxed format. The boxed answer must appear at the very end of your response and contain only the final answer, not explanations.
benchmark:
  name: imo_answerbench
  config:
    dataset: Hwilner/imo-answerbench
    split: train
    max_tasks: 3
sandbox: null
scorer:
  name: imo_verify
  config: {}
max_concurrent: 3
num_samples: 1
output_dir: ./results
strict_report: true
strict_isolation: true
metadata:
  notes: 3-task IMO-AnswerBench openclaw smoke with thinking on, long64k, logprob capture.
  smoke_setting: long64k
  expected_task_count: 3
