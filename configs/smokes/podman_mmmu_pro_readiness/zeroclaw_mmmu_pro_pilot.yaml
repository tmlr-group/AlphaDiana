run_id: "podman_mmmu_zeroclaw_mmmu_pro_pilot"

agent:
  name: zeroclaw
  version: "0.6.9"
  config:
    runtime_backend: podman
    podman_image: "${ALPHADIANA_ZEROCLAW_PODMAN_IMAGE}"
    podman_network: "host"
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "${OPENAI_MODEL_NAME}"
    enable_thinking: false
    gateway_token: "ZEROCLAW"
    request_timeout: 600
    gateway_startup_timeout: 180
    gateway_warmup_timeout: 180
    gateway_warmup_initial_delay: 0
    provider_max_tokens: 1024
    max_tool_iterations: 40
    max_actions_per_hour: 100
    system_prompt: |
      Solve the MMMU-Pro vision-only multiple-choice task. Inspect every
      workspace image attachment before deciding. The final line must be:
      $$\boxed{your answer here}$$

benchmark:
  name: mmmu_pro
  config:
    dataset: "MMMU/MMMU_Pro"
    data_config: "vision"
    split: "test"
    dataset_indices:
      - 0
      - 1
      - 2

sandbox: null

scorer:
  name: exact_match
  config: {}

max_concurrent: 1
num_samples: 1
output_dir: "./results"
metadata:
  validation_campaign: "podman-mmmu-pro-readiness-pilot"
  container_engine: "podman"
  supports_multimodal: true
  selected_dataset_indices:
    - 0
    - 1
    - 2
  selected_task_ids:
    - "mmmu_pro_test_History_1"
    - "mmmu_pro_test_Art_113"
    - "mmmu_pro_validation_Design_19"
  notes: "Phase 6 ZeroClaw Podman MMMU-Pro vision 3-task pilot."
