run_id: "podman_nightly_20260514_openclaw_imo"

agent:
  name: openclaw
  version: "2026.3.20"
  config:
    runtime_backend: podman
    podman_gateway_config_path: "alphadiana/harness/openclaw/deploy/podman_gateway.yaml"
    podman_image: "${ALPHADIANA_OPENCLAW_PODMAN_IMAGE}"
    openclaw_config_path: "alphadiana/harness/openclaw/deploy/openclaw.json"
    OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME}"
    model: openclaw
    gateway_token: "${OPENCLAW_GATEWAY_TOKEN}"
    request_timeout: 600
    gateway_startup_timeout: 180
    gateway_warmup_enabled: false
    max_tokens: 2048
    max_attempts: 1
    stream_total_timeout: 600
    system_prompt: |
      Solve the competition math problem. The final line must be
      $$\boxed{your answer here}$$.

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"
    dataset_index: 367
    max_tasks: 1

sandbox: null

scorer:
  name: imo_verify

max_concurrent: 1
num_samples: 1
output_dir: "./results"
metadata:
  validation_campaign: "podman-nightly-validation"
  container_engine: "podman"
  notes: "Validation-only OpenClaw Podman IMO-AnswerBench row."
