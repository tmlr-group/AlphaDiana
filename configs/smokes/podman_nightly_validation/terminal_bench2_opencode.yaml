# TerminalBench2 OpenCode validation-only Podman campaign row.

run_id: "podman_nightly_20260514_terminal_bench2_opencode"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_DIR}
    task_ids:
      - db-wal-recovery
      - fix-git
      - overfull-hbox
    max_tasks: 3

agent:
  name: terminal_bench2_opencode
  version: "1.0"
  config:
    container_engine: podman
    model: "custom/${OPENAI_MODEL_NAME}"
    model_name: ${OPENAI_MODEL_NAME}
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    runtime_source_image: "${TB2_OPENCODE_RUNTIME_IMAGE}"
    logs_base_dir: "${ALPHADIANA_TB2_LOGS_DIR}"
    tool_call: true
    streaming: false
    solver_timeout_sec: 1800
    timeout_sec: 900
    test_timeout_sec: 1200

scorer:
  name: terminal_bench2

max_concurrent: 1
num_samples: 1
output_dir: "./results"
metadata:
  validation_campaign: "podman-nightly-validation"
  container_engine: "podman"
  notes: "Validation-only Podman TerminalBench2 row; Direct x TB2 remains out of scope."
