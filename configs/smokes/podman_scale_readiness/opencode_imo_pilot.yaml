run_id: "podman_scale_opencode_imo_pilot"

agent:
  name: opencode
  version: "1.0.0"
  config:
    controller_mode: podman
    controller_image: "localhost/alphadiana-opencode-podman:latest"
    controller_network: "host"
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model_name: "${OPENAI_MODEL_NAME}"
    enable_thinking: true
    timeout: 600
    max_tokens: 2048
    system_prompt: |
      Solve the competition math problem. The final line must be
      $$\boxed{your answer here}$$.

benchmark:
  name: imo_answerbench
  config:
    dataset: "Hwilner/imo-answerbench"
    split: "train"
    max_tasks: 3

sandbox: null

scorer:
  name: imo_verify

max_concurrent: 1
num_samples: 1
output_dir: "./results"
metadata:
  validation_campaign: "podman-scale-readiness-pilot"
  container_engine: "podman"
  notes: "Phase 5 OpenCode Podman IMO-AnswerBench 3-task pilot."
