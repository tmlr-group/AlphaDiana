run_id: "podman_swe_verified_openclaw_pilot32"

agent:
  name: openclaw
  version: "2026.3.20"
  config:
    runtime: "swebench_container"
    openclaw_config_path: "alphadiana/harness/openclaw/deploy/openclaw_swe_bench.runtime.json"
    container_gateway_host: "127.0.0.1"
    container_gateway_port: 8080
    gateway_token: "OPENCLAW"
    openai_base_url: "${PODMAN_SWE_CONTAINER_OPENAI_BASE_URL}"
    openai_api_key: "${OPENAI_API_KEY}"
    openai_model_name: "${OPENAI_MODEL_NAME}"
    model: "openclaw"
    max_tokens: 32768
    request_timeout: 7200
    stream_total_timeout: 7200
    stream_idle_timeout: 900
    max_attempts: 1

benchmark:
  name: swe_bench
  config:
    dataset: "SWE-bench/SWE-bench_Verified"
    split: "test"
    include_hints: false
    taskset_path: "alphadiana/context/podman-swe-verified-readiness/tasksets/pilot32.json"
    max_tasks: 10

sandbox:
  name: swebench_container
  config:
    container_engine: podman
    podman_socket: "${ALPHADIANA_PODMAN_SOCKET}"
    docker_api_version: "${ALPHADIANA_PODMAN_DOCKER_API_VERSION}"
    namespace: "swebench"
    docker_build_network: "host"
    network_mode: "host"
    force_rebuild: false
    keep_container: false
    keep_logs: true
    log_dir: "./logs/podman-swe-verified-readiness/task-containers/${PODMAN_SWE_RUN_PREFIX}/openclaw_pilot32"
    gateway_host: "127.0.0.1"
    gateway_port: 8080

scorer:
  name: swe_bench
  config:
    timeout: 3600
    container_engine: podman
    podman_socket: "${ALPHADIANA_PODMAN_SOCKET}"
    docker_api_version: "${ALPHADIANA_PODMAN_DOCKER_API_VERSION}"
    namespace: "swebench"
    docker_build_network: "host"
    force_rebuild: false
    log_dir: "./logs/podman-swe-verified-readiness/swe-bench-eval/${PODMAN_SWE_RUN_PREFIX}/openclaw_pilot32"

max_concurrent: 1
num_samples: 1
task_retries: 0
output_dir: "./results"
metadata:
  validation_campaign: "podman-swe-verified-readiness"
  container_engine: "podman"
  tier: "pilot32"
  run_suffix: "openclaw_pilot32"
  max_output_tokens: 32768
  taskset_path: "alphadiana/context/podman-swe-verified-readiness/tasksets/pilot32.json"
  support_scope: "SWE-bench Verified selected-task Podman readiness only"
