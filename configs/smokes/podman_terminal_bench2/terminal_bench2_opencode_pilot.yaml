# TerminalBench2 OpenCode Podman task-container readiness pilot.

run_id: "podman_tb2_terminal_bench2_opencode"

benchmark:
  name: terminal_bench2
  config:
    tasks_dir: ${TERMINAL_BENCH2_DIR}
    task_ids:
      - db-wal-recovery
      - overfull-hbox
      - adaptive-rejection-sampler
    max_tasks: 3

agent:
  name: terminal_bench2_opencode
  version: "1.0"
  config:
    container_engine: podman
    model: "custom/${OPENAI_MODEL_NAME}"
    model_name: ${OPENAI_MODEL_NAME}
    api_base: ${OPENAI_BASE_URL}
    api_key: ${OPENAI_API_KEY}
    runtime_source_image: "${TB2_OPENCODE_RUNTIME_IMAGE}"
    logs_base_dir: "${ALPHADIANA_TB2_LOGS_DIR}"
    tool_call: true
    streaming: false
    solver_timeout_sec: 1800
    timeout_sec: 900
    test_timeout_sec: 1200

scorer:
  name: terminal_bench2

max_concurrent: 1
num_samples: 1
output_dir: "${ALPHADIANA_TB2_OUTPUT_DIR}"
metadata:
  validation_campaign: "podman-terminal-bench2-readiness-pilot"
  container_engine: "podman"
  run_suffix: "terminal_bench2_opencode"
  selected_task_names:
    - db-wal-recovery
    - overfull-hbox
    - adaptive-rejection-sampler
  selected_task_ids:
    - tb2_db-wal-recovery
    - tb2_overfull-hbox
    - tb2_adaptive-rejection-sampler
  notes: "Podman TerminalBench2 small-matrix row; Direct x TB2 and full-sweep TB2 remain out of scope."
