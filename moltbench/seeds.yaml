# MoltBench Seed Projects
#
# Each seed project is an external repository that serves as an evaluation
# target. Seeds are NOT vendored into this repo — they are cloned at Docker
# build time or setup time.
#
# To add a new seed project, append an entry below and create the
# corresponding Dockerfile + run_task.sh launch function.
# See moltbench/docs/README.md for the full guide.

seeds:
  autokernel:
    repo: https://github.com/RightNow-AI/autokernel.git
    commit: "7843582"
    description: >
      Autonomous GPU kernel optimization for any PyTorch model.
      KernelBench (L1-L4, 270 problems): agent optimizes kernel.py
      (Triton / CUDA Python) to maximize speedup over PyTorch reference.
    benchmark_id: autokernel
    workdir: /workspace/autokernel
    eval_script: kernelbench/bench_kb.py
    base_image: nvidia/cuda:12.8.0-devel-ubuntu22.04
    build_time: ~15 min (gpu-base) + ~2 min (agent layer)
    eval_time: ~90 sec per round

  # qjl:
  #   repo: https://github.com/amirzandieh/QJL.git
  #   commit: "648b364"
  #   description: >
  #     Quantized Johnson-Lindenstrauss KV Cache compression.
  #     Agent optimizes CUDA C++ kernels (qjl_kernel/csrc/*.cu)
  #     to minimize runtime while keeping distortion < 0.15.
  #   benchmark_id: qjl
  #   workdir: /workspace/QJL
  #   eval_script: bench_cuda.py
  #   base_image: nvidia/cuda:12.1.0-devel-ubuntu22.04
  #   build_time: ~10 min
  #   eval_time: ~3.5 min per round (nvcc compile + bench)

  mini_sglang:
    repo: https://github.com/sgl-project/mini-sglang.git
    commit: "main"
    description: >
      Simplified SGLang LLM serving engine (mini-sglang).
      Agent optimizes scheduler/engine/core Python code to maximize
      inference throughput (tokens/second) for Qwen3-4B.
      Uses flashinfer attention backend. Server restarts between rounds.
      Verified: OG=3.72x with qwen3-235b on A800 GPU.
    benchmark_id: mini_sglang
    workdir: /workspace/repo
    eval_script: /eval/run_eval
    base_image: jinbo/mini-sglang:clean
    build_time: ~5 min (base) + ~3 min (openclaw layer)
    eval_time: ~2 min per round (server restart + benchmark)
