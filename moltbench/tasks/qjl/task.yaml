task_id: moltbench_qjl_optimize
family: cuda_kernel_optimization
task_name: QJL KV-cache CUDA optimization
description: Optimize QJL CUDA kernels under a protected hidden-input verifier.
moltbench_task_level: optimization_only

seed_project:
  source: https://github.com/amirzandieh/QJL.git
  commit_or_version: "648b364"
  license: Apache-2.0
  baseline_command: >-
    podman run --rm --runtime runc --device nvidia.com/gpu=all
    --entrypoint python3
    -e QJL_BASELINE_RUNTIME_MS=3.486
    -e QJL_DISTORTION_THRESHOLD=0.52
    -e QJL_HIDDEN_SEEDS=42,1234,2025
    localhost/alphadiana:qjl-verifier
    /verifier/official_eval.py --candidate /verifier/seed_candidate.json
  baseline_score:
    runtime_ms: 3.486
    distortion: 0.495494
  environment_lockfile: moltbench/tasks/qjl/environment.lock.json

stages:
  - stage_id: stage_01_bootstrap
    type: bootstrap
  - stage_id: stage_02_improvement
    type: improvement

workspace:
  editable_paths:
    - qjl_kernel/csrc/*.cu
  protected_paths:
    - /eval/run_eval
    - /verifier
    - /hidden_tests
    - /scoring
    - /official_eval

verifier:
  run_eval_command: /eval/run_eval
  official_eval_command: host:official_eval
  hidden_files:
    - /verifier/bench_cuda.py
    - hidden QJL random seeds
  timeout_sec: 1200

budget:
  max_stages: 2
  max_attempts_per_stage: 5
  attempt_timeout_sec: 1200
  total_timeout_sec: 3600
  max_tool_calls: 200
  max_model_calls: 100
  max_tokens: 65536
  max_cost_usd: null

scoring:
  correctness_metric: build succeeds and max hidden-input distortion < 0.52
  gain_metric: baseline_runtime_ms / candidate_runtime_ms
  stability_metric: final_valid_gain / episode_best_valid_gain >= 0.90
  memory_metric: N/A
  drift_metric: N/A
  cost_metric: attempts, verifier calls, wall/GPU time, calls, tokens, cost

artifacts:
  required_outputs:
    - manifest.json
    - score.json
    - patch.diff
    - changed_files.json
    - audit_report.md
  required_logs:
    - attempts.jsonl
    - events.jsonl
    - verifier_results.jsonl
    - tool_calls.jsonl
    - model_calls.jsonl
    - file_diffs.jsonl
  required_snapshots:
    - initial_workspace_snapshot
    - final_workspace_snapshot
    - best_workspace_snapshot

contamination:
  training_allowed: false
  hidden_data_exposed: false
  retrieval_allowed: true
  network_allowed: true
  network_policy: agent network is deployment-controlled; official verifier uses no network and feedback seeds are disjoint from official seeds

hardware:
  cuda: "12.1"
  validated_gpu: NVIDIA A800 80GB
  validated_gpu_arches: [sm_80]
  torch_cuda_arch_list: ["8.0"]
