working_dir: "."

run_cmd: export PATH=$(find /tmp/rock-runtime-envs/node -name 'npm' -type f ! -path '*/nodewin/*'
  ! -path '*/shims/*' 2>/dev/null | head -1 | xargs dirname):$PATH && OPENCLAW_CONFIG_PATH=${working_dir}/openclaw.json
  nohup openclaw gateway >> /root/gateway.log 2>&1 &

runtime_env_config:
  type: node
  npm_registry: https://registry.npmmirror.com
  custom_install_cmd: git config --global url.'https://github.com/'.insteadOf 'ssh://git@github.com/' && (openclaw --version 2>/dev/null | grep -q '2026.3.7' && echo 'openclaw 2026.3.7 already installed, skipping' || npm install -g openclaw@2026.3.7 --registry https://registry.npmmirror.com)
  install_timeout: 1200

env:
  OPENAI_BASE_URL: "http://192.0.2.14:8000/v1"
  OPENAI_API_KEY: "EMPTY"
  OPENAI_MODEL_NAME: "/hd1/models/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218"
  OPENCLAW_GATEWAY_TOKEN: "OPENCLAW"
