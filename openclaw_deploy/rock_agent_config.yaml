working_dir: "."

run_cmd: export PATH=${bin_dir}:$PATH && OPENCLAW_CONFIG_PATH=${working_dir}/openclaw.json nohup openclaw gateway >> /root/gateway.log 2>&1 &

runtime_env_config:
  type: node
  npm_registry: https://registry.npmmirror.com
  custom_install_cmd: openclaw --version || npm install -g openclaw@2026.3.7 --omit=optional
  install_timeout: 1200

env:
  OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME}"
  OPENCLAW_GATEWAY_TOKEN: "OPENCLAW"
