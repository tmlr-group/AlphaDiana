[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphadiana"
version = "0.1.0"
description = "Evaluation system for foundation models on frontier reasoning benchmarks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "datasets>=2.0",
    "openai>=1.0",
    "httpx>=0.24",
    "requests>=2.28",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7,<4", "scipy>=1.10"]
judges = ["openai>=1.0", "requests>=2.28"]
benchmarks = ["datasets>=2.0", "tomli>=2.0; python_version<'3.11'"]
agents = ["openai>=1.0", "httpx>=0.24"]
sandbox = ["requests>=2.28"]
swebench = [
    "docker>=7.0.0",
    "swebench>=4.0.0,<5",
]
rock = [
    "rl-rock[admin,sandbox-actor]>=1.3.0,<2",
    "nacos-sdk-python==2.0.9",
]
all = [
    "scipy>=1.10",
    "matplotlib>=3.7,<4",
    "datasets>=2.0",
    "tomli>=2.0; python_version<'3.11'",
    "openai>=1.0",
    "httpx>=0.24",
    "requests>=2.28",
    "docker>=7.0.0",
    "swebench>=4.0.0,<5",
    "rl-rock[admin,sandbox-actor]>=1.3.0,<2",
    "nacos-sdk-python==2.0.9",
]
dashboard = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.24"]

[project.scripts]
alphadiana = "alphadiana.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alphadiana*"]

[tool.setuptools.package-data]
"alphadiana.harness" = ["skills/**/*", "skills/**/.claude-plugin/*.json"]
"alphadiana.analysis.actions" = ["action_prompt.md"]
"alphadiana.benchmarks.terminal_bench2.harness" = ["assets/*.ts", "deploy/*.yaml"]
"alphadiana.harness._internal" = ["deploy/*"]

"alphadiana.harness.openclaw" = ["deploy/*.json", "deploy/*.yaml", "deploy/*.js", "deploy/Dockerfile*"]
"alphadiana.harness.opencode" = ["deploy/Containerfile*"]
"alphadiana.harness.zeroclaw" = ["deploy/Dockerfile*"]
"alphadiana.benchmarks.swe_bench" = ["assets/*.sh", "assets/*.json", "assets/*.template"]
