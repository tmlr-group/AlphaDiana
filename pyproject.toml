[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphadiana"
version = "0.1.0"
description = "Evaluation system for foundation models on frontier reasoning benchmarks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
benchmarks = ["datasets>=2.0", "tomli>=2.0; python_version<'3.11'"]
agents = ["openai>=1.0", "httpx>=0.24"]
sandbox = ["requests>=2.28"]
swebench = [
    "docker>=7.0.0",
    "swebench>=4.0.0",
]
rock = [
    "rl-rock[admin,sandbox-actor]>=1.3.0,<2",
    "nacos-sdk-python==2.0.9",
]
# DecodingTrust Agent Platform (DTAP) bridge. The DTAP code itself is vendored
# as the ref/DecodingTrust-Agent git submodule (init with
# `git submodule update --init --recursive ref/DecodingTrust-Agent`); this extra
# only covers the pip deps AlphaDiana's bridge imports directly (the MCP client).
decodingtrust = [
    "mcp>=1.0",
    "openai>=1.0",
    "httpx>=0.24",
]
all = [
    "datasets>=2.0",
    "tomli>=2.0; python_version<'3.11'",
    "openai>=1.0",
    "httpx>=0.24",
    "requests>=2.28",
    "docker>=7.0.0",
    "swebench>=4.0.0",
    "rl-rock[admin,sandbox-actor]>=1.3.0,<2",
    "nacos-sdk-python==2.0.9",
    "mcp>=1.0",
]
dashboard = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.24"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
alphadiana = "alphadiana.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alphadiana*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services (vLLM, ROCK, OpenClaw)",
    "asyncio: async tests",
]
